name: Release

# Push a vX.Y.Z tag on main to release it:
#   1. GoReleaser builds archives for Linux, macOS and Windows, checksums, and
#      multi-arch images on ghcr.io, into a draft release.
#   2. The archives get build provenance attestations.
#   3. The Homebrew formula is attached and the release published;
#      phongndo/homebrew-tap's updater copies the formula into the tap.
#   4. The version is listed in the MCP Registry.
# Re-running a failed run is safe: each step replaces what an earlier attempt left.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the release
      packages: write # the images
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attach the Homebrew formula and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/formula.sh "$TAG" dist/checksums.txt > dist/alive2-mcp.rb
          ruby -c dist/alive2-mcp.rb
          gh release upload "$TAG" dist/alive2-mcp.rb --clobber
          gh release edit "$TAG" --draft=false --latest
      - name: Tell the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN; the tap picks up $TAG on its next hourly update."
            exit 0
          fi
          gh api --method POST repos/phongndo/homebrew-tap/dispatches \
            -f event_type=alive2-mcp-release -f "client_payload[release_tag]=$TAG"

  mcp-registry:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC login proves the io.github.phongndo namespace
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish this version
        run: |
          version=${TAG#v}
          jq --arg v "$version" '.version = $v | .packages[0].identifier = "ghcr.io/phongndo/alive2-mcp:" + $v' \
            server.json > server.release.json
          mv server.release.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
