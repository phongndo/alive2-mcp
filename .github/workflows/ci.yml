name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Build, go test (with a fake Alive2 server), golangci-lint and formatting.
      - run: nix flake check -L
      - name: Evaluate every supported system
        if: matrix.os == 'ubuntu-24.04'
        run: nix flake check --all-systems --no-build
      - name: Smoke-test the binary
        run: nix run . -- -version

  # Everything the Release workflow builds, without publishing, so a broken
  # release shows up here rather than when a tag is pushed.
  release-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Generate the Homebrew formula
        run: |
          version=$(jq -r .version dist/metadata.json)
          scripts/formula.sh "v$version" dist/checksums.txt > dist/alive2-mcp.rb
          ruby -c dist/alive2-mcp.rb
      - name: Run a built image
        run: |
          image=$(docker images ghcr.io/phongndo/alive2-mcp --format '{{.Repository}}:{{.Tag}}' | head -1)
          test -n "$image"
          docker run --rm "$image" -version
          docker inspect "$image" --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}' |
            grep -Fx io.github.phongndo/alive2-mcp
